[package]
name = "telegram-bot-lite"
version = "0.1.0"
edition = "2024"
description = "A minimal async Telegram Bot API client built on async-io and rustls, with no I/O dependencies on logging."
repository = "https://github.com/Romacat2/Rust-Telegram-Bot"
license = "MIT"
publish = true

[dependencies]
async-io = "*"
futures-lite = "*"
futures-rustls = "*"
webpki-roots = "*"

# --- Transtion ---
serde = { version = ">0.0.0", features = ["derive"] }
serde_json = ">0.0.0"
